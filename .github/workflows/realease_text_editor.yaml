name: Release text_editor

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: |
          cargo test -p text_editor
          cargo test -p data_structures

      - name: Build
        run: cargo build -p text_editor --release

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/release/text_editor text_editor-${{ runner.os }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: ren target\release\text_editor.exe text_editor-Windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: text_editor-${{ runner.os }}
          path: text_editor-${{ runner.os }}*
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */text_editor-*
          fail_on_unmatched_files: true
