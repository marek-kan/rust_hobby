[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "selector"
description = "Tools for orthogonal matching pursuit and non-linear correlation"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["numpy>=1.26,<2.0"]

[tool.maturin]
features = ["python"]
python-source = "py_src"
